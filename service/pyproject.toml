[project]
name = "fakt-wiki-agent"
version = "0.1.0"
description = "FAKT II Wiki-Agent: PydanticAI + FastAPI + Redis Rate-Limit"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[google]>=0.0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.2",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
